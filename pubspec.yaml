name: auto_scroll_text
description: >-
  Single line text widget that scrolls its content automatically, so long texts
  stay readable without overlapping or being cut off by TextOverflow.ellipsis.
version: 1.0.0
homepage: https://github.com/Bomsamdi/auto_scroll_text
repository: https://github.com/Bomsamdi/auto_scroll_text
issue_tracker: https://github.com/Bomsamdi/auto_scroll_text/issues

topics:
  - text
  - marquee
  - scrolling
  - widget
  - ui

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
